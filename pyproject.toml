[build-system]
requires = [
    "setuptools>=67.0.0",
    "scikit-build>=0.16.7",
    "cmake>=3.20.0",
    "ninja",
    "setuptools_scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "fpm"
license = { text = "MIT License" }
authors = [{ name = "fpm maintainers" }]
requires-python = ">=3.7"
description = "Fortran package manager"
readme = "docs/README.md"
keywords = ["fpm", "fortran", "package manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Fortran",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Pre-processors",
    "Topic :: Utilities",
]
dynamic = ["version", "entry-points", "scripts"]

[project.urls]
homepage = "https://fpm.fortran-lang.org"
source-code = "https://github.com/fortran-lang/fpm"
bug-tracker = "https://github.com/fortran-lang/fpm/issues"

[tool.setuptools_scm]
write_to = "src/fpm/_version.py"

[tool.cibuildwheel]
build = "cp312-*"
build-verbosity = "3"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
before-build = "bash {project}/tools/wheels/cibw_before_build_macos.sh {project}"
environment = { CC = "clang", CXX = "clang++", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[[tool.cibuildwheel.overrides]]
# apply only to the Apple-silicon wheel that is built on the x86-64 runner
select = "*-macosx_arm64"

# still run the same bootstrap script
before-build = "bash {project}/tools/wheels/cibw_before_build_macos.sh {project}"

# ---------------------------------------------------------------------
# Environment *seen by CMake while it configures the wheel build*
# ---------------------------------------------------------------------
[tool.cibuildwheel.overrides.environment]
CC  = "clang"
CXX = "clang++"
FC  = "/usr/local/bin/gfortran"
# *** Link-time flags ***
# Ð search the GCC runtime built by the script
# Ð keep the rpath
# Ð pass the SDK root with the correct Ò-Wl,Ó wrapper (clang needs it!)
LDFLAGS = "-L/Users/runner/mf/envs/gfortran-darwin-arm64-cross/lib/gcc/arm64-apple-darwin20.0.0/14.2.0 \
           -Wl,-rpath,/Users/runner/mf/envs/gfortran-darwin-arm64-cross/lib/gcc/arm64-apple-darwin20.0.0/14.2.0 \
           -Wl,-syslibroot,$(xcrun --show-sdk-path)"

[tool.cibuildwheel.windows]
archs = ["auto64"]
environment = { CC = "gcc", CXX = "g++", FC = "gfortran" }


