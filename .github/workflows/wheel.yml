name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.sys.os }}
    runs-on: ${{ matrix.sys.os }}
    strategy:
      fail-fast: false
      matrix:
        sys:
          - { os: windows-2019, shell: "msys2 {0}" }
          - { os: ubuntu-22.04, shell: bash }
          - { os: macos-13, shell: bash }
    defaults:
      run:
        shell: ${{ matrix.sys.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran from conda-forge
        if: runner.os == 'macos'
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: fpm-build
          create-args: >-
            gfortran_impl_osx-64=14.2.0
            libgfortran5=14.2.0
          cache-downloads: true
          init-shell: bash  # ensure the env activates correctly

      - name: Add gfortran to PATH
        if: runner.os == 'macos'
        run: echo "$HOME/micromamba/envs/fpm-build/bin" >> $GITHUB_PATH
          
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc-fortran

      - name: Build wheels
        run: |
          pipx run cibuildwheel

      - name: Make wheels pythonless
        run: |
          pip install wheel>=0.40.0
          wheel tags --python-tag py3 --abi-tag none --remove ./wheelhouse/*.whl

      - if: runner.os == 'Linux'
        name: Build source distribution
        run: |
          pipx run build --sdist --outdir=wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.sys.os }}
          path: |
            ./wheelhouse/*.whl
            ./wheelhouse/*.tar.gz

  publish:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheels*
          path: dist
          merge-multiple: true

      - name: Publish package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
