name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.sys.os }}
    runs-on: ${{ matrix.sys.os }}
    strategy:
      fail-fast: false
      matrix:
        sys:
          - { os: windows-2019, shell: "msys2 {0}" }
          - { os: ubuntu-22.04, shell: bash }
          - { os: macos-13, shell: bash }
    defaults:
      run:
        shell: ${{ matrix.sys.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran via Homebrew
        if: runner.os == 'macos'
        run: |
          brew install gcc
          echo "/opt/homebrew/bin" >> $GITHUB_PATH          

      - name: Add Homebrew gfortran to PATH
        if: runner.os == 'macos'
        run: |
          brew_prefix=$(brew --prefix)
          gfortran_path=$(find "$brew_prefix/bin" -type f -name 'gfortran-*' | sort -V | tail -n 1)

          if [ -z "$gfortran_path" ]; then
            echo "::error ::No gfortran-* found in $brew_prefix/bin"
            exit 1
          fi

          echo "Found gfortran: $gfortran_path"

          # Create a symlink as gfortran -> gfortran-13 (etc.)
          ln -sf "$gfortran_path" "$brew_prefix/bin/gfortran"

          # Ensure the path is picked up by subsequent steps
          echo "$brew_prefix/bin" >> $GITHUB_PATH
                  
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc-fortran

      - name: Build wheels
        run: |
          pipx run cibuildwheel

      - name: Make wheels pythonless
        run: |
          pip install wheel>=0.40.0
          wheel tags --python-tag py3 --abi-tag none --remove ./wheelhouse/*.whl

      - if: runner.os == 'Linux'
        name: Build source distribution
        run: |
          pipx run build --sdist --outdir=wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.sys.os }}
          path: |
            ./wheelhouse/*.whl
            ./wheelhouse/*.tar.gz

  publish:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheels*
          path: dist
          merge-multiple: true

      - name: Publish package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
